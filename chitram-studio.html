<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Chitram Studio</title>
  <meta name="description" content="Chitram Studio — an all-in-one media & file studio by Swarjun Tech: radio, PDF tools, scanner, photo & video editor, and more." />

  <!-- Link preview (WhatsApp, etc.). Add an og:image once a hosted banner
       exists for a richer card; text-only preview works fine without it. -->
  <meta property="og:title" content="Chitram Studio — by Swarjun Tech" />
  <meta property="og:description" content="Download Chitram Studio for Android." />
  <meta property="og:type" content="website" />

  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f6f7f9; color: #17181a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121316; color: #f2f3f5; }
      .card { background: #1c1e22 !important; }
      .btn.secondary { border-color: #3a3d44 !important; color: #f2f3f5 !important; }
    }
    .card {
      background: #fff; border-radius: 20px; padding: 32px 24px; max-width: 380px;
      width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 8px 0 4px; font-size: 26px; }
    p.tag { margin: 0 0 24px; opacity: .7; font-size: 15px; line-height: 1.5; }
    .btn {
      display: block; width: 100%; padding: 14px 18px; margin: 10px 0;
      border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 15px;
    }
    .btn.primary { background: #1a73e8; color: #fff; }
    .btn.secondary { background: transparent; border: 1.5px solid #d0d3d9; color: #17181a; }
    .note { font-size: 13px; opacity: .6; margin-top: 16px; }
    .by { font-size: 12px; opacity: .5; margin-top: 20px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Chitram Studio</h1>
    <p class="tag">An all-in-one media &amp; file studio — radio, PDF tools, scanner, photo &amp; video editor, and more.</p>

    <a id="android" class="btn primary hidden" href="#">Get it on Google Play</a>
    <a id="ios" class="btn primary hidden" href="#">Download on the App Store</a>
    <p id="iosSoon" class="note hidden">The iPhone app is coming soon.</p>

    <p class="by">An app by Swarjun Tech</p>
  </main>

  <script>
    // Fill APP_STORE in once the iOS listing is live, e.g.
    // 'https://apps.apple.com/app/chitram-studio/id0000000000'
    var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.chitramstudio.toolbox';
    var APP_STORE  = '';

    var ua = navigator.userAgent || navigator.vendor || '';
    var isAndroid = /android/i.test(ua);
    // iPadOS 13+ reports as a Mac, so also check for a touch-capable "MacIntel".
    var isIOS = /iphone|ipad|ipod/i.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    function show(id) { document.getElementById(id).classList.remove('hidden'); }

    if (isAndroid) {
      // Auto-forward Android visitors straight to Play.
      location.replace(PLAY_STORE);
      document.getElementById('android').href = PLAY_STORE;
      show('android');
    } else if (isIOS) {
      if (APP_STORE) {
        location.replace(APP_STORE);
        document.getElementById('ios').href = APP_STORE;
        show('ios');
      } else {
        show('iosSoon'); // listing not live yet — don't hand out a dead link
      }
    } else {
      // Desktop / unknown: show whatever store links exist, no auto-redirect.
      document.getElementById('android').href = PLAY_STORE;
      show('android');
      if (APP_STORE) {
        document.getElementById('ios').href = APP_STORE;
        document.getElementById('ios').className = 'btn secondary';
        show('ios');
      }
    }
  </script>
</body>
</html>
